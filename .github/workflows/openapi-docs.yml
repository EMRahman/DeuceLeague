name: Refresh OpenAPI snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/openapi-docs.yml
      - .node-version
      - package.json
      - package-lock.json
      - tsconfig*.json
      - packages/api/**
      - packages/schema/**
      - scripts/generate-openapi.mjs

permissions:
  contents: write

concurrency:
  group: openapi-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run docs:openapi
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- docs/openapi.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json
          git commit -m "docs: refresh OpenAPI snapshot"
          git push
