name: Capture README preview

on:
  push:
    branches: [codex/capture-readme-preview]

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node capture-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: product-preview
          path: product-preview.png
