# On the server, on top of docker-compose.yml: nothing is reachable from the
# internet but Caddy, which serves the website and the API at one address over
# HTTPS, with certificates it gets and renews itself; and the database is
# dumped to ./backups every night. Named in .env, so a plain `docker compose`
# picks it up:
#
#   COMPOSE_FILE=docker-compose.yml:deploy/compose.production.yml
#
# See docs/SELF-HOSTING.md.

services:
  # Reachable only from the other containers.
  postgres:
    ports: !reset []
  api:
    ports: !reset []
  website:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to the league's address, e.g. league.deuce-ltc.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - website

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: deuceleague
      PGDATABASE: deuceleague
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  # Caddy's certificates. Losing them only means asking Let's Encrypt again.
  caddy_data:
  caddy_config:
