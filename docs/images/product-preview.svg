<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760" role="img" aria-labelledby="title desc">
  <title id="title">DeuceLeague mobile website preview</title>
  <desc id="desc">Three phone screens showing a player's home page, league tables and score reporting.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#e8eee7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-opacity=".18"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d1d1b }
      .muted { fill: #6b6a66 }
      .green { fill: #2f6b3a }
      .small { font-size: 12px }
      .body { font-size: 14px }
      .label { font-size: 15px; font-weight: 650 }
      .heading { font-size: 22px; font-weight: 750 }
      .line { stroke: #e3e1db; stroke-width: 1 }
      .card { fill: #fff; stroke: #e3e1db }
      .button { fill: #2f6b3a }
      .buttonText { fill: #fff; font-size: 13px; font-weight: 700 }
    </style>
  </defs>

  <rect width="1260" height="760" rx="30" fill="url(#backdrop)"/>

  <!-- Home -->
  <g transform="translate(35 25)" filter="url(#shadow)">
    <rect width="350" height="670" rx="48" fill="#1d1d1b"/>
    <rect x="10" y="10" width="330" height="650" rx="39" fill="#fbfaf7"/>
    <rect x="132" y="18" width="86" height="18" rx="9" fill="#1d1d1b"/>
    <g class="ui" transform="translate(30 56) scale(1.15 1.1)">
      <text class="label" x="0" y="14">Local Tennis Club</text>
      <text class="small green" x="174" y="14">Matches</text>
      <text class="small" x="225" y="14">Tables</text>
      <line class="line" x1="-16" y1="29" x2="264" y2="29"/>

      <text class="heading" x="0" y="65">Your matches</text>
      <rect x="0" y="84" width="248" height="82" rx="10" fill="#fdf1e2"/>
      <text x="13" y="105" font-size="12" font-weight="700" fill="#8a4b08">Needs your answer</text>
      <text class="body" x="13" y="128">Sam K. reported 6–4, 3–6, 10–7</text>
      <text class="small muted" x="13" y="147">Men's Singles · Division 2</text>

      <text class="label" x="0" y="196">Matches still to play</text>
      <rect class="card" x="0" y="210" width="248" height="116" rx="10"/>
      <text class="body green" x="13" y="235" font-weight="650">Alex P.</text>
      <text class="small muted" x="13" y="252">Men's Singles · Division 2</text>
      <line class="line" x1="13" y1="267" x2="235" y2="267"/>
      <text class="body green" x="13" y="291" font-weight="650">Jordan M.</text>
      <text class="small muted" x="13" y="308">Men's Singles · Division 2</text>

      <text class="label" x="0" y="357">Where you stand</text>
      <rect class="card" x="0" y="371" width="248" height="66" rx="10"/>
      <text class="body" x="13" y="396" font-weight="650">Men's Singles</text>
      <text class="small muted" x="13" y="417">Division 2 · 3rd of 6</text>

      <text class="label" x="0" y="468">Court outlook</text>
      <rect class="card" x="0" y="482" width="248" height="58" rx="10"/>
      <text class="small muted" x="13" y="501">Thu       Fri       Sat       Sun</text>
      <text x="15" y="525" font-size="17">☀︎        ☁︎        ☂        ☀︎</text>
    </g>
  </g>

  <!-- Tables -->
  <g transform="translate(455 25)" filter="url(#shadow)">
    <rect width="350" height="670" rx="48" fill="#1d1d1b"/>
    <rect x="10" y="10" width="330" height="650" rx="39" fill="#fbfaf7"/>
    <rect x="132" y="18" width="86" height="18" rx="9" fill="#1d1d1b"/>
    <g class="ui" transform="translate(30 56) scale(1.15 1.1)">
      <text class="label" x="0" y="14">Local Tennis Club</text>
      <text class="small" x="174" y="14">Matches</text>
      <text class="small green" x="225" y="14">Tables</text>
      <line class="line" x1="-16" y1="29" x2="264" y2="29"/>

      <text class="heading" x="0" y="65">League tables</text>
      <rect x="0" y="82" width="121" height="27" rx="13" fill="#e6f3e8"/>
      <text x="11" y="100" font-size="11" font-weight="700" fill="#1f5b2c">CURRENT · AUTUMN</text>
      <rect x="128" y="82" width="61" height="27" rx="13" fill="#eceef1"/>
      <text class="small muted" x="141" y="100">Summer</text>

      <rect x="0" y="125" width="103" height="29" rx="14" fill="#2f6b3a"/>
      <text class="buttonText" x="13" y="144">Men's Singles</text>
      <rect x="110" y="125" width="121" height="29" rx="14" fill="#fff" stroke="#e3e1db"/>
      <text class="small" x="124" y="144">Women's Doubles</text>

      <text class="label" x="0" y="190">Division 2</text>
      <text class="small muted" x="198" y="190">P   W   Pts</text>
      <line x1="0" y1="204" x2="248" y2="204" stroke="#2f6b3a" stroke-width="3"/>
      <text class="body" x="4" y="228">1</text><text class="body" x="27" y="228" font-weight="650">Priya N.</text><text class="body" x="198" y="228">5   4    14</text>
      <line class="line" x1="0" y1="241" x2="248" y2="241"/>
      <text class="body" x="4" y="265">2</text><text class="body" x="27" y="265">Sam K.</text><text class="body" x="198" y="265">5   4    13</text>
      <line class="line" x1="0" y1="278" x2="248" y2="278"/>
      <rect x="0" y="284" width="248" height="37" fill="#e9f4ea"/>
      <text class="body" x="4" y="308">3</text><text class="body" x="27" y="308" font-weight="700">You</text><text class="body" x="198" y="308">4   3    11</text>
      <line class="line" x1="0" y1="327" x2="248" y2="327"/>
      <text class="body" x="4" y="351">4</text><text class="body" x="27" y="351">Alex P.</text><text class="body" x="198" y="351">5   2     8</text>
      <line class="line" x1="0" y1="364" x2="248" y2="364"/>
      <text class="body" x="4" y="388">5</text><text class="body" x="27" y="388">Jordan M.</text><text class="body" x="198" y="388">4   1     5</text>
      <line x1="0" y1="401" x2="248" y2="401" stroke="#a3341f" stroke-width="3"/>
      <text class="body" x="4" y="425">6</text><text class="body" x="27" y="425">Chris D.</text><text class="body" x="198" y="425">5   0     2</text>

      <rect class="card" x="0" y="455" width="248" height="76" rx="10"/>
      <text class="small muted" x="13" y="477">Tap a player to see every result.</text>
      <text class="small" x="13" y="499">Promotion and relegation places</text>
      <text class="small muted" x="13" y="517">are marked on the table.</text>
    </g>
  </g>

  <!-- Match report -->
  <g transform="translate(875 25)" filter="url(#shadow)">
    <rect width="350" height="670" rx="48" fill="#1d1d1b"/>
    <rect x="10" y="10" width="330" height="650" rx="39" fill="#fbfaf7"/>
    <rect x="132" y="18" width="86" height="18" rx="9" fill="#1d1d1b"/>
    <g class="ui" transform="translate(30 56) scale(1.15 1.1)">
      <text class="label" x="0" y="14">Local Tennis Club</text>
      <text class="small green" x="174" y="14">Matches</text>
      <text class="small" x="225" y="14">Tables</text>
      <line class="line" x1="-16" y1="29" x2="264" y2="29"/>

      <text class="small green" x="0" y="58">Men's Singles · Division 2</text>
      <text class="heading" x="0" y="88">You v Sam K.</text>
      <rect class="card" x="0" y="107" width="248" height="390" rx="11"/>
      <text class="label" x="14" y="134">Report the score</text>
      <text class="small muted" x="14" y="157">How did it end?</text>
      <rect x="14" y="169" width="220" height="37" rx="8" fill="#fff" stroke="#2f6b3a" stroke-width="2"/>
      <circle cx="29" cy="187" r="6" fill="#2f6b3a"/>
      <text class="body" x="43" y="192">We played it out</text>
      <rect x="14" y="213" width="220" height="37" rx="8" fill="#fff" stroke="#e3e1db"/>
      <circle cx="29" cy="231" r="6" fill="#fff" stroke="#aaa"/>
      <text class="body" x="43" y="236">Someone retired part-way</text>

      <text class="small muted" x="14" y="276">                         You       Sam</text>
      <text class="body" x="14" y="307">Set 1</text>
      <rect x="119" y="288" width="46" height="28" rx="6" fill="#fff" stroke="#d4d1ca"/><text class="body" x="137" y="307">6</text>
      <rect x="178" y="288" width="46" height="28" rx="6" fill="#fff" stroke="#d4d1ca"/><text class="body" x="196" y="307">4</text>
      <text class="body" x="14" y="345">Set 2</text>
      <rect x="119" y="326" width="46" height="28" rx="6" fill="#fff" stroke="#d4d1ca"/><text class="body" x="137" y="345">3</text>
      <rect x="178" y="326" width="46" height="28" rx="6" fill="#fff" stroke="#d4d1ca"/><text class="body" x="196" y="345">6</text>
      <text class="body" x="14" y="383">Match tiebreak</text>
      <rect x="119" y="364" width="46" height="28" rx="6" fill="#fff" stroke="#d4d1ca"/><text class="body" x="134" y="383">10</text>
      <rect x="178" y="364" width="46" height="28" rx="6" fill="#fff" stroke="#d4d1ca"/><text class="body" x="196" y="383">7</text>

      <rect class="button" x="14" y="419" width="108" height="42" rx="9"/>
      <text class="buttonText" x="31" y="445">Send the score</text>
      <text class="small muted" x="14" y="481">It counts when Sam agrees it.</text>
      <text class="small muted" x="0" y="530">Simple score entry, with the match</text>
      <text class="small muted" x="0" y="546">format checked before it is sent.</text>
    </g>
  </g>

  <text x="210" y="730" text-anchor="middle" class="ui label">Home</text>
  <text x="630" y="730" text-anchor="middle" class="ui label">Tables</text>
  <text x="1050" y="730" text-anchor="middle" class="ui label">Report a score</text>
</svg>
